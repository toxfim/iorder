<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10141a" media="(prefers-color-scheme: dark)" />
    <!-- Same-origin and blocking on purpose: it sets the stored theme before the first paint. -->
    <script src="/theme-init.js"></script>
    <title>iOrder.uz</title>
    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta
      name="description"
      content="iOrder.uz xodimlari uchun: buyurtmalar, prays-list va tasdiqlashlar."
    />
    <!-- Link previews (Telegram, messengers). The image is shared by both apps and every
         environment, so one absolute production URL is enough; crawlers need an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="iOrder.uz" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:title" content="iOrder.uz — xodimlar paneli" />
    <meta
      property="og:description"
      content="iOrder.uz xodimlari uchun: buyurtmalar, prays-list va tasdiqlashlar."
    />
    <meta property="og:image" content="https://order.iorder.uz/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="960" />
    <meta property="og:image:height" content="540" />
    <meta property="og:image:alt" content="iorder.uz — ulgurji prays-list va B2B buyurtma" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
