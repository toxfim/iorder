# Local development database only. Production hosting is not decided yet (ADR-001 §3.8).
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iorder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: iorder_dev
    ports:
      # 5433 on the host so it does not clash with a locally installed PostgreSQL on 5432
      - '127.0.0.1:5433:5432'
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/
      - iorder_pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iorder -d iorder_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  iorder_pgdata:
