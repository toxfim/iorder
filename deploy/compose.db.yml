# The one PostgreSQL of the server, shared by staging and production (separate databases and
# roles). Host port 5434: the server's own PostgreSQL 10 and 9.5 already use 5432 and 5433.
#   docker compose -f deploy/compose.db.yml up -d
name: iorder-db

services:
  postgres:
    image: postgres:18-alpine
    container_name: iorder-postgres
    restart: unless-stopped
    # POSTGRES_PASSWORD of the superuser `iorder_owner` (the migrator of every database).
    env_file: /srv/iorder/db.env
    environment:
      POSTGRES_USER: iorder_owner
      POSTGRES_DB: iorder_owner
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - iorder_pgdata:/var/lib/postgresql
    networks: [iorder]
    # The server also runs other sites: never let the database starve them of CPU. (Its kernel has
    # no memory cgroup, so mem_limit would be ignored; PostgreSQL's defaults stay small anyway.)
    cpus: 1.5
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iorder_owner']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  iorder_pgdata:

networks:
  iorder:
    name: iorder
