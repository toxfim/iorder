# Staging customer app (website and Telegram Mini App). certbot --apache adds the :443 copy.
<VirtualHost *:80>
    ServerName dev.order.iorder.uz
    DocumentRoot /srv/iorder/staging/www/customer

    <Directory /srv/iorder/staging/www/customer>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Same api as dev.dashboard; the Telegram webhook arrives here as /api/telegram/webhook/<secret>.
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:3100/ timeout=60
    ProxyPassReverse /api/ http://127.0.0.1:3100/

    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(index\.html)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    Header always set X-Robots-Tag "noindex, nofollow"

    # Security headers; see dev.dashboard.iorder.uz.conf for the reasoning behind each value.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://telegram.org; frame-src https://oauth.telegram.org; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"

    ErrorLog ${APACHE_LOG_DIR}/iorder-staging-customer-error.log
    CustomLog ${APACHE_LOG_DIR}/iorder-staging-customer-access.log combined
</VirtualHost>
