# Staging staff app. certbot --apache adds the :443 copy (dev.dashboard.iorder.uz-le-ssl.conf).
<VirtualHost *:80>
    ServerName dev.dashboard.iorder.uz
    DocumentRoot /srv/iorder/staging/www/staff

    <Directory /srv/iorder/staging/www/staff>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # The api is called under /api; the prefix is stripped here (VITE_API_BASE_URL=/api).
    # One proxy hop in front of it: TRUST_PROXY=1 in api.env.
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:3100/ timeout=60
    ProxyPassReverse /api/ http://127.0.0.1:3100/

    # Hashed bundles never change; index.html must always be fresh.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(index\.html)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    Header always set X-Robots-Tag "noindex, nofollow"

    # Security headers. certbot copies this file into the :443 vhost, so they apply to both; HSTS
    # is sent only over TLS (the expr), as the spec requires.
    # frame-ancestors: the app runs as a Telegram Mini App, which web.telegram.org loads in an
    # iframe, so a blanket DENY would break it. script-src: the Telegram Login Widget script,
    # which evaluates code at runtime and so needs 'unsafe-eval' (without it the widget throws and
    # never draws its button; script SOURCES stay limited to this site and telegram.org);
    # frame-src: the widget's own iframe. 'unsafe-inline' for styles only: Vue scoped styles.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://telegram.org; frame-src https://oauth.telegram.org; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"

    ErrorLog ${APACHE_LOG_DIR}/iorder-staging-staff-error.log
    CustomLog ${APACHE_LOG_DIR}/iorder-staging-staff-access.log combined
</VirtualHost>
