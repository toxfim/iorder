# Apex domain. The owner plans a landing page here later (2026-11-06); until then it sends visitors
# to the customer app with a TEMPORARY (302) redirect, so browsers do not cache it and the landing
# can replace it without stale redirects. DNS for iorder.uz/www is managed at ahost.uz and must
# point to this server before certbot can run: certbot --apache -d iorder.uz -d www.iorder.uz
<VirtualHost *:80>
    ServerName iorder.uz
    ServerAlias www.iorder.uz
    Redirect temp / https://order.iorder.uz/
    ErrorLog ${APACHE_LOG_DIR}/iorder-root-error.log
    CustomLog ${APACHE_LOG_DIR}/iorder-root-access.log combined
</VirtualHost>
