name: Set up the workspace
description: pnpm, Node, dependencies, and the Turborepo cache of earlier runs.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.17.0

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # Turborepo hashes each package's inputs, so a package nothing touched replays its last result.
    - uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-

    - run: pnpm install --frozen-lockfile
      shell: bash
